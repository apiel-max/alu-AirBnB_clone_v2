<!DOCTYPE html>
<HTML lang="en">
    <HEAD>
        <TITLE>HBNB</TITLE>
        <LINK rel="stylesheet" type="text/css"
              href="../static/styles/4-common.css">
        <LINK rel="stylesheet" type="text/css"
              href="../static/styles/3-header.css">
        <LINK rel="stylesheet" type="text/css"
              href="../static/styles/3-footer.css">
        <LINK rel="stylesheet" type="text/css"
              href="../static/styles/6-filters.css">
    </HEAD>
    <BODY>
        <HEADER>
            <IMG src="../static/images/logo.png" alt="HBNB logo">
        </HEADER>
        <MAIN>
            <DIV class="filters">
                <DIV class="locations">
                    <H3>States</H3>
                    <H4>&nbsp;</H4>
                    <DIV class="popover">
                        <UL>
                            {% for state in states %}
                            <LI class="state">
                                <A href="#">{{ state.name }}</A>
                                <UL>
                                    {% for city in state.cities | sort(attribute='name') %}
                                    <LI class="city">
                                        <A href="#">{{ city.name }}</A>
                                    </LI>
                                    {% endfor %}
                                </UL>
                            </LI>
                            {% endfor %}
                        </UL>
                    </DIV>
                </DIV>
                <DIV class="amenities">
                    <H3>Amenities</H3>
                    <H4>&nbsp;</H4>
                    <DIV class="popover">
                        <UL>
                            {% for amenity in amenities %}
                            <LI><A href="#">{{ amenity.name }}</A></LI>
                            {% endfor %}
                        </UL>
                    </DIV>
                </DIV>
            </DIV>
        </MAIN>
        <FOOTER>
            <P>Holberton School</P>
        </FOOTER>
    </BODY>
</HTML>
